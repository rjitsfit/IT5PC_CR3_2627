<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Retrieve</title>
</head>
<body>
    <button id="oneRecord">Fetch User</button>
    <br>
    <div id="showOneRecord"></div>
    <br>
    <button id="manyRecords">Fetch Multiple Users</button>
    <br>
    <div id="showManyRecords"></div>

    <script>
        document.getElementById ('oneRecord')
            .addEventListener ('click', loadUser)

        document.getElementById ('manyRecords')
            .addEventListener ('click', loadUsers)

        function loadUser () {
            const xhr = new XMLHttpRequest ()

            xhr.open ('GET', './user.json', true)

            xhr.onload = function () {
                if (xhr.status == 200) {
                    const user = JSON.parse (this.responseText)

                    let output = ''

                    output += `
                        <ul>
                            <li>Id : ${user.id}</li>
                            <li>Name : ${user.name}</li>
                            <li>Occupation : ${user.occupation}</li>
                        </ul>
                    `
                    document.getElementById ('showOneRecord')
                        .innerHTML = output
                }
            }
            xhr.send ()
        }


        function loadUsers () {
            const xhr = new XMLHttpRequest ()

            xhr.open ('GET', './users.json', true)

            xhr.onload = function () {
                if (xhr.status == 200) {
                    const users = JSON.parse (this.responseText)

                    let outputs = ''

                    for (let u in users) {
                        outputs += `
                            <ul>
                                <li>Id : ${users[u].id}</li>
                                <li>Name : ${users[u].name}</li>
                                <li>Occupation : ${users[u].occupation}</li>
                            </ul>
                        `
                    }
                    document.getElementById ('showManyRecords')
                        .innerHTML = outputs
                }
            }
            xhr.send ()
        }

    </script>
</body>
</html>
